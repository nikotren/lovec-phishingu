<title>Lovec phishingu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: jedna "plocha" s oknem poštovního klienta; titulka, briefing a výsledky jsou karty na stejné ploše. */
:root{
  --desk:#dbe4ec;--desk-2:#c9d5e0;--win:#ffffff;--win-2:#f2f5f8;--line:#dce3ea;
  --ink:#13222e;--ink-2:#4f616e;--ink-3:#74858f;
  --rail:#13304b;--rail-ink:#b9cde0;--rail-on:#ffffff;--rail-hi:#1f4569;
  --flag:#c8441c;--on-flag:#ffffff;--ok:#0f7a58;--ok-bg:#dff2ea;--bad:#c4263f;--bad-bg:#fbe4e8;--warn:#8a5a00;--warn-bg:#fcefc9;
  --mark:#fff0a8;--link:#1558b0;--shadow:0 1px 0 rgba(0,0,0,.04),0 18px 40px -16px rgba(19,34,46,.35);
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;--f-body:'Figtree',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0b131a;--desk-2:#12202b;--win:#15202a;--win-2:#1a2733;--line:#263645;
  --ink:#e6eef5;--ink-2:#a6b7c4;--ink-3:#7a8c98;
  --rail:#0c1a27;--rail-ink:#8fa8bd;--rail-on:#ffffff;--rail-hi:#17304a;
  --flag:#ff7f50;--on-flag:#1d0c05;--ok:#47d6a0;--ok-bg:#12372c;--bad:#ff7088;--bad-bg:#40171f;--warn:#f1c24f;--warn-bg:#3b2f0e;
  --mark:#6a5710;--link:#7db4ff;--shadow:0 18px 40px -16px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0b131a;--desk-2:#12202b;--win:#15202a;--win-2:#1a2733;--line:#263645;
  --ink:#e6eef5;--ink-2:#a6b7c4;--ink-3:#7a8c98;
  --rail:#0c1a27;--rail-ink:#8fa8bd;--rail-on:#ffffff;--rail-hi:#17304a;
  --flag:#ff7f50;--on-flag:#1d0c05;--ok:#47d6a0;--ok-bg:#12372c;--bad:#ff7088;--bad-bg:#40171f;--warn:#f1c24f;--warn-bg:#3b2f0e;
  --mark:#6a5710;--link:#7db4ff;--shadow:0 18px 40px -16px rgba(0,0,0,.7);color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--desk);background-image:radial-gradient(var(--desk-2) 1.2px,transparent 1.2px);background-size:22px 22px;color:var(--ink);font:400 15px/1.5 var(--f-body);
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.1}
p{margin:0}
code{font-family:var(--f-mono);font-size:.92em}
.wrap{max-width:1240px;margin:0 auto}
.ic{flex:none;vertical-align:-3px}

/* buttons */
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--win);font-weight:700;line-height:1.2;transition:transform .08s,background .15s}
.b:active{transform:translateY(1px)}
.b small{font-weight:500;opacity:.8;font-size:12px}
.b[disabled]{opacity:.45;cursor:not-allowed}
.b-flag{background:var(--flag);border-color:var(--flag);color:var(--on-flag)}
.b-ok{border-color:var(--ok);color:var(--ok)}
.b-ok:hover{background:var(--ok-bg)}
.b-ghost:hover{background:var(--win-2)}
.b-big{padding:14px 24px;font-size:17px;border-radius:12px}
.linkbtn{background:none;border:0;color:var(--link);padding:2px 0;font-weight:500;text-decoration:underline;text-underline-offset:3px}

/* card screens */
.card{background:var(--win);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:clamp(20px,4vw,40px)}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;font:800 18px var(--f-display)}
.logo{width:36px;height:36px;border-radius:10px;background:var(--rail);color:#fff;display:grid;place-items:center}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--win);display:grid;place-items:center;color:var(--ink-2)}

/* title */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(20px,4vw,48px);align-items:center}
.hero h1{font-size:clamp(44px,8vw,92px);font-weight:800;letter-spacing:-.03em;line-height:.92}
.hero h1 em{font-style:normal;color:var(--flag)}
.lead{font-size:18px;color:var(--ink-2);max-width:46ch;margin:18px 0 22px}
.namebox{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.namebox input{flex:1 1 200px;min-width:0;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--win-2)}
.steps{display:grid;gap:8px;margin-top:22px;padding:0;list-style:none;color:var(--ink-2);font-size:14px}
.steps li{display:flex;gap:10px;align-items:flex-start}
.steps b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--win-2);border:1px solid var(--line);font:500 12px var(--f-mono);color:var(--ink);flex:none}
.pstats{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.pstats b{display:block;font:800 22px var(--f-display);color:var(--ink)}
.stack{position:relative;height:340px;max-width:440px;margin-inline:auto;width:100%}
.mini{position:absolute;left:0;right:0;background:var(--win);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.mini .f{font-weight:700;font-size:14px}.mini .s{color:var(--ink-2);font-size:13px}
.mini .u{font:400 12px var(--f-mono);color:var(--bad);margin-top:6px;word-break:break-all}
.mini:nth-child(1){top:0;transform:rotate(-3deg)}
.mini:nth-child(2){top:92px;transform:rotate(2deg);left:18px;right:-6px}
.mini:nth-child(3){top:196px;transform:rotate(-1.5deg);left:6px}
.pill-st{position:absolute;right:12px;top:-12px;border:2.5px solid;border-radius:6px;padding:2px 10px;font:800 13px var(--f-display);letter-spacing:.08em;transform:rotate(6deg);background:var(--win)}
.pill-st.p{color:var(--flag);border-color:var(--flag)}.pill-st.g{color:var(--ok);border-color:var(--ok)}

/* brief */
.brief{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(20px,4vw,40px)}
.brief h2{font-size:clamp(30px,5vw,52px);font-weight:800;letter-spacing:-.02em;margin:8px 0 12px}
.tip{background:var(--warn-bg);color:var(--ink);border-radius:12px;padding:14px 16px;margin:18px 0;border:1px solid var(--line)}
.tip b{display:block;font:500 12px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--warn);margin-bottom:4px}
.rules{display:grid;gap:8px;list-style:none;padding:0;margin:0;font-size:14px}
.rules li{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border-radius:10px;background:var(--win-2)}
.rules span:last-child{font:500 13px var(--f-mono);white-space:nowrap}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.dots{display:flex;gap:6px;margin:12px 0}
.dots i{width:30px;height:6px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--flag)}.dots i.done{background:var(--ok)}

/* game window */
.win{background:var(--win);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;height:clamp(560px,calc(100dvh - 40px),820px)}
.hud{background:var(--rail);color:var(--rail-on);display:flex;align-items:center;gap:10px 14px;padding:10px 14px;flex-wrap:wrap}
.hud .t{font:800 16px var(--f-display);margin-right:auto;display:flex;align-items:center;gap:10px;min-width:0}
.hud .t span.sub{font:500 12px var(--f-mono);color:var(--rail-ink);letter-spacing:.04em}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--rail-hi);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--rail-ink);white-space:nowrap}
.chip b{color:var(--rail-on);font-weight:700;font-variant-numeric:tabular-nums}
.hrt{color:var(--rail-hi);display:inline-flex}.hrt.on{color:#ff6b81}.hrt.on svg{fill:currentColor}
.hrt.lost{animation:shake .4s}
.hud .iconbtn{background:var(--rail-hi);border-color:transparent;color:var(--rail-ink);width:34px;height:34px}
.client{flex:1;display:grid;grid-template-columns:190px 330px minmax(0,1fr);min-height:0}
.rail{background:var(--rail);color:var(--rail-ink);padding:8px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.rail .f{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px}
.rail .f.on{background:var(--rail-hi);color:var(--rail-on);font-weight:700}
.rail .f em{margin-left:auto;font:500 12px var(--f-mono);font-style:normal}
.rail .me{margin-top:auto;padding:10px;font:400 11px var(--f-mono);word-break:break-all;color:var(--rail-ink)}
.list{border-right:1px solid var(--line);overflow:auto;background:var(--win)}
.li{display:flex;gap:10px;width:100%;text-align:left;padding:12px;border:0;border-bottom:1px solid var(--line);background:none;position:relative}
.li:hover{background:var(--win-2)}
.li.sel{background:color-mix(in srgb,var(--link) 12%,var(--win))}
.li.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--link)}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 13px var(--f-display);color:#fff;background:hsl(var(--h) 45% 38%)}
.li .m{min-width:0;flex:1}
.li .r1{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.li .r1 b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .r1 time{font:400 11px var(--f-mono);color:var(--ink-3);flex:none}
.li .sj{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li.unread .r1 b,.li.unread .sj{font-weight:700;color:var(--ink)}
.li.unread .av::after{content:"";position:absolute;left:6px;top:12px;width:9px;height:9px;border-radius:50%;background:var(--link);border:2px solid var(--win)}
.li .st{display:inline-flex;align-items:center;gap:4px;font:700 11px var(--f-body);margin-top:3px;padding:1px 7px;border-radius:99px}
.st.good{background:var(--ok-bg);color:var(--ok)}.st.bad{background:var(--bad-bg);color:var(--bad)}.st.warn{background:var(--warn-bg);color:var(--warn)}.st.neu{background:var(--win-2);color:var(--ink-2)}
.li.done{opacity:.8}
.read{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;background:var(--win)}
.rhead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.rhead h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.back-btn{display:none}
.rbody{flex:1;overflow:auto;padding:16px 18px 20px;position:relative}
.sender{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sender .av{position:static}
.sinfo{flex:1;min-width:0}
.sname{background:none;border:0;padding:0;font-weight:700;font-size:15px;text-align:left;cursor:help;border-bottom:1px dotted var(--ink-3)}
.sto{font-size:12px;color:var(--ink-3)}
.hdrs{margin:12px 0 0;border:1px solid var(--line);border-radius:10px;background:var(--win-2);padding:4px;font-size:13px}
.hrow{display:flex;gap:12px;align-items:baseline;padding:7px 10px;border-radius:7px;cursor:pointer}
.hrow>span:first-child{width:76px;flex:none;color:var(--ink-3);font-size:12px}
.hrow code{word-break:break-all}
.auth-pass{color:var(--ok)}.auth-fail{color:var(--bad)}.auth-none{color:var(--ink-2)}
.mail-body{margin-top:18px;font-size:15.5px;line-height:1.65;max-width:68ch}
.mail-body p{margin:0 0 14px}
.mail-body blockquote{margin:0 0 14px;padding:8px 12px;border-left:3px solid var(--line);color:var(--ink-3);font-size:13px}
.mk{cursor:pointer;border-radius:4px;text-decoration:underline dotted var(--ink-3);text-underline-offset:4px;transition:background .15s}
.mk:hover{background:color-mix(in srgb,var(--mark) 55%,transparent)}
.mk.on{background:var(--mark);text-decoration:none;box-shadow:0 0 0 2px var(--mark)}
.mk.hit{background:var(--ok-bg);color:var(--ok);text-decoration:none;box-shadow:0 0 0 2px var(--ok-bg);cursor:default}
.mk.miss{outline:2px dashed var(--flag);outline-offset:2px;cursor:default;text-decoration:none}
.mk.fine{background:var(--win-2);cursor:default;text-decoration:line-through}
.lnk{color:var(--link);word-break:break-word}
.lbtn{display:inline-block;background:var(--link);color:#fff;padding:10px 18px;border-radius:8px;font-weight:700;text-decoration:none;margin:2px 0}
:root[data-theme="dark"] .lbtn{color:#07121e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lbtn{color:#07121e}}
.lbtn.mk.on,.lbtn.mk.hit{color:var(--ink)}
.qr{display:inline-flex;flex-direction:column;align-items:center;gap:6px;background:var(--win-2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12px;color:var(--ink-2)}
.qr svg{width:132px;height:132px;border-radius:4px}
.atts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.att{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--win-2);font-size:14px}
.att small{color:var(--ink-3);font-family:var(--f-mono);font-size:11px}
.att span{word-break:break-all;text-align:left}
.ractions{border-top:1px solid var(--line);padding:12px 18px;background:var(--win-2)}
.abtns{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--ink-3);margin-bottom:8px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hint b{color:var(--ink);font-variant-numeric:tabular-nums}
.empty{margin:auto;text-align:center;color:var(--ink-2);padding:30px;max-width:340px}
.empty svg{color:var(--ink-3);margin-bottom:10px}
.status{border-top:1px solid var(--line);background:var(--win-2);font:400 12px var(--f-mono);padding:5px 12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:27px}
.status.on{color:var(--ink);background:var(--warn-bg)}

/* feedback */
.fb{margin-top:22px;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:var(--win)}
.fb-h{display:flex;gap:12px;align-items:center;padding:14px 16px}
.fb-h h3{font-size:19px;font-weight:700}
.fb.good .fb-h{background:var(--ok-bg);color:var(--ok)}.fb.bad .fb-h{background:var(--bad-bg);color:var(--bad)}.fb.warn .fb-h{background:var(--warn-bg);color:var(--warn)}.fb.neu .fb-h{background:var(--win-2)}
.fb-b{padding:14px 16px;display:grid;gap:14px}
.ledger{display:grid;gap:3px;font-size:14px}
.ledger div{display:flex;justify-content:space-between;gap:12px}
.ledger b{font-family:var(--f-mono);font-size:13px;font-weight:500}
.ledger .tot{border-top:1px solid var(--line);padding-top:5px;margin-top:3px;font-weight:700}
.clues{display:grid;gap:6px;margin:0;padding:0;list-style:none;font-size:14px}
.clues li{display:flex;gap:10px;align-items:flex-start}
.clues .ck{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;margin-top:1px}
.clues .f .ck{background:var(--ok);color:var(--win)}.clues .m .ck{border:2px dashed var(--flag);color:var(--flag)}
.sub-h{font:500 12px var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin-bottom:6px}
.stamp{position:absolute;right:22px;top:14px;border:3px solid;border-radius:8px;padding:4px 12px;font:800 20px var(--f-display);letter-spacing:.08em;transform:rotate(7deg);pointer-events:none;background:color-mix(in srgb,var(--win) 80%,transparent);z-index:2}
.stamp.good{color:var(--ok)}.stamp.bad{color:var(--bad)}.stamp.warn{color:var(--warn)}.stamp.neu{color:var(--ink-2)}
.stamp.flag{color:var(--flag)}

/* modals */
.back{position:fixed;inset:0;background:rgba(6,12,18,.62);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.sheet{background:var(--win);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(480px,100%);box-shadow:var(--shadow);display:grid;gap:12px}
.sheet h3{font-size:20px}
.url{display:block;background:var(--win-2);border:1px solid var(--line);border-radius:10px;padding:12px;word-break:break-all;font-size:14px}
.srow{display:flex;gap:8px;flex-wrap:wrap}
.bwin{background:#fff;color:#1b2430;border-radius:12px;width:min(560px,100%);overflow:hidden;box-shadow:var(--shadow)}
.btop{background:#e8ecf1;display:flex;align-items:center;gap:8px;padding:8px 10px}
.burl{flex:1;min-width:0;background:#fff;border-radius:99px;padding:5px 12px;font:400 12px var(--f-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#1b2430}
.btop button{background:none;border:0;color:#44505d;display:grid;place-items:center;padding:4px}
.sim{background:#fff6d6;color:#6b5200;font-size:11px;padding:4px 12px;text-align:center}
.bpage{padding:26px 28px 30px;display:grid;gap:10px}
.bpage h3{font-size:22px;color:#1b2430}
.bpage label{font-size:12px;font-weight:700;color:#44505d}
.bpage input{width:100%;padding:10px 12px;border:1.5px solid #c8d1da;border-radius:8px;background:#fff;color:#1b2430}
.fbrand{font:800 20px var(--f-display);color:#0b5cbd;display:flex;align-items:center;gap:8px}
.fbrand i{width:22px;height:22px;border-radius:5px;background:#0b5cbd;display:inline-block}
.fbtn{background:#0b5cbd;color:#fff;border:0;border-radius:8px;padding:12px;font-weight:700;margin-top:6px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.doc{background:#f4f6f8;border:1px solid #d5dce3;border-radius:6px;padding:16px;display:grid;gap:7px}
.doc i{display:block;height:9px;border-radius:5px;background:#cfd6dd;filter:blur(1.5px)}
.docbar{background:#ffe8a3;border:1px solid #e6c456;border-radius:6px;padding:10px 12px;font-size:13px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;color:#4f3d00}
.docbar button{background:#217346;color:#fff;border:0;border-radius:6px;padding:7px 12px;font-weight:700}
.safe-ok{display:flex;gap:10px;align-items:center;color:#0f7a58;font-weight:700}

/* summary / archive */
.sum-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:18px 0}
.kpi{background:var(--win-2);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font:800 26px var(--f-display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--ink-2)}
.rowlist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.rowlist li{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;align-items:start}
.rowlist .sj{font-weight:700}.rowlist p{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.cert{border:2px solid var(--ink);border-radius:14px;padding:clamp(18px,4vw,34px);text-align:center;position:relative;background:var(--win-2);margin:18px 0}
.cert::before{content:"";position:absolute;inset:6px;border:1px solid var(--line);border-radius:9px;pointer-events:none}
.cert h2{font-size:clamp(30px,6vw,54px);font-weight:800;letter-spacing:-.02em;color:var(--flag);margin:6px 0}
.cert .nm{font:700 22px var(--f-display)}
.tabs{display:flex;gap:6px;margin:6px 0 18px;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--win);font-weight:700;font-size:14px}
.tab.on{background:var(--ink);color:var(--win);border-color:var(--ink)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.lcard{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--win);display:grid;gap:8px;align-content:start}
.lcard.lock{background:var(--win-2);color:var(--ink-3)}
.gl{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--rail);color:#fff;font:800 18px var(--f-display)}
.lock .gl{background:var(--line);color:var(--ink-3)}
.lcard h3{font-size:17px}

.lcard .do{font-size:13.5px;background:var(--win-2);padding:8px 10px;border-radius:8px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.badge{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px}

.badge.off{opacity:.55;background:var(--win-2)}.badge.off .gl{background:var(--line);color:var(--ink-3)}
.badge b{display:block}.badge span{font-size:12.5px;color:var(--ink-2)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.trow{display:grid;grid-template-columns:minmax(120px,200px) 1fr 60px;gap:10px;align-items:center;font-size:14px;padding:6px 0}
.toasts{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:grid;gap:8px;z-index:60;width:min(420px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--ink);color:var(--win);padding:10px 14px;border-radius:10px;font-size:14px;box-shadow:var(--shadow)}
.copybox{display:flex;gap:8px;margin-top:10px}.copybox input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--win-2);font:400 13px var(--f-mono)}

{id:11,type:'legit',phish:false,time:'08:44',from:{n:'Jana Nováková',a:'jana.novakova@novaterm.cz'},auth:'pass',

{id:12,type:'legit',phish:false,time:'09:01',from:{n:'Kancelářské potřeby Moravia',a:'novinky@kancelarskepotreby-moravia.cz'},auth:'pass',
 subj:'Podzimní slevy až 30 % na papír a toner',

{id:13,type:'ceo',phish:true,time:'07:18',from:{n:'Pavel Horák',a:'pavel.horak.novaterm@gmail.com'},auth:'none',
 subj:'Důvěrné – potřebuji vaši pomoc',

 clues:{h_from:'Ředitel píše z firemní adresy novaterm.cz. Tady je soukromý gmail.',nophone:'Útočník se vyhýbá telefonu, protože by ho prozradil hlas.',pay:'Neobvyklá platba mimo schvalovací proces je typický podvod „CEO fraud“.',conf:'Utajení brání kolegům, aby podvod odhalili.'},
 why:'Soukromá adresa, utajená urgentní platba a „nemůžu telefonovat“. Platbu bys ověřil telefonem a přes schvalovací proces.'},

{id:16,type:'legit',phish:false,time:'08:15',from:{n:'Hyper365',a:'no-reply@hyper365.com'},auth:'pass',

{id:22,type:'support',phish:true,time:'08:30',from:{n:'Hyper365 Billing',a:'billing@hyper365-invoice.com'},auth:'none',

function authText(a){return a==='pass'?'prošlo (SPF a DKIM)':a==='fail'?'selhalo – odesílatel nemusí být pravý':'neověřeno'}
function qrSvg(seed){
  let h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))>>>0;
  const n=21,rnd=()=>{h=(h*1664525+1013904223)>>>0;return h/4294967296};
  const fin=(x,y)=>{for(const [ox,oy] of [[0,0],[14,0],[0,14]]){const dx=x-ox,dy=y-oy;if(dx>=0&&dx<7&&dy>=0&&dy<7)return (dx===0||dx===6||dy===0||dy===6||(dx>=2&&dx<=4&&dy>=2&&dy<=4))?1:0;}return -1};
  let r='';for(let y=0;y<n;y++)for(let x=0;x<n;x++){const f=fin(x,y);const on=f===-1?rnd()>.5:f===1;if(f===-1&&on||f===1)r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
  return `<svg viewBox="-1 -1 23 23" shape-rendering="crispEdges" role="img" aria-label="QR kód"><rect x="-1" y="-1" width="23" height="23" fill="#fff"/><g fill="#111">${r}</g></svg>`;
}
function richBody(m,cls){
  let li=0;
  return m.body.split('\n\n').map(p=>{
    const quote=p.startsWith('> ');
    let h=esc(quote?p.slice(2):p).replace(/\n/g,'<br>');
    h=h.replace(/\[\[([^|\]]+)\|([^|\]]*)(?:\|([^|\]]*))?(?:\|([^|\]]*))?\]\]/g,(_,url,txt,k,st)=>{
      const key=(k&&m.clues[k])?k:'l'+(li++);
      const a=`data-act="link" data-url="${url}" data-t="${txt}" data-c="${key}"`;
      if(st==='qr')return `<button type="button" class="qr mk ${cls(key)}" ${a}>${qrSvg(url)}<span>Naskenovat kód</span></button>`;
      return `<a href="#" class="lnk mk ${st==='btn'?'lbtn':''} ${cls(key)}" ${a}>${txt}</a>`;
    });
    h=h.replace(/\{\{(\w+)\|([^}]*)\}\}/g,(_,k,t)=>`<span class="mk ${cls(k)}" data-act="mark" data-c="${k}">${t}</span>`);
    return quote?`<blockquote>${h}</blockquote>`:`<p>${h}</p>`;
  }).join('');
}

/* ---------- herní logika ---------- */
function ts(type,ok){const t=P.ts[type]||(P.ts[type]={ok:0,n:0});t.n++;if(ok)t.ok++;P.unlocked[type]=true}
function decide(act){
  const m=cur();if(!m||S.res[m.id]||S.over)return;
  const marks=S.marks[m.id]||[];
  const found=marks.filter(k=>m.clues[k]).length,total=Object.keys(m.clues).length;
  const mult=1+0.1*Math.min(S.streak,5);
  const r={act,lines:[],pts:0,ok:null};
  const gainMult=(base,label)=>{const bonus=Math.round(base*(mult-1)/10)*10;r.lines.push([label,base]);if(bonus)r.lines.push([`Série ×${mult.toFixed(1).replace('.',',')}`,bonus]);return base+bonus};
  if(act==='it'){
    if(!S.it)return;S.it--;r.pts=-250;r.lines.push(['Dotaz na IT',-250]);
    P.unlocked[m.type]=true;sfx.click();
  }else{
    const correct=(act==='report')===m.phish;r.ok=correct;S.stat.dec++;
    if(correct){
      if(m.phish){
        let pts=gainMult(500,'Správné nahlášení');
        if(found){const c=found*50;r.lines.splice(1,0,[`Stopy (${found}/${total})`,c]);pts+=c}
        r.pts=pts;
        if(found===total&&total>0)P.fullClues++;
        award('first');
      }else{r.pts=gainMult(200,'Pravou zprávu ponechat')}
      S.streak++;S.stat.good++;sfx.good();
    }else{
      S.streak=0;
      if(act==='report'){r.pts=-300;r.lines.push(['Falešný poplach',-300]);S.stat.fp++}
      else{r.pts=-1500;r.lines.push(['Naletěl jsi (ztráta důvěry)',-1500]);S.hearts--;S.stat.miss++;r.heart=true}
      S.sh.wrong++;sfx.bad();
    }
    ts(m.type,correct);
  }
  S.money+=r.pts;S.res[m.id]=r;
  if(S.hearts<=0)S.over=true;
  if(S.streak>=8)award('streak8');
  if(P.fullClues>=5)award('detective');
  if(Object.keys(TYPES).every(k=>P.unlocked[k]))award('collector');
  save();afterResolve(r.heart);
}
function compromise(m){
  const r={act:'comp',ok:false,pts:-2000,lines:[['Údaje odeslány útočníkům',-2000]],heart:true};
  S.money-=2000;S.hearts--;S.streak=0;S.sh.wrong++;S.stat.creds++;S.stat.dec++;
  ts(m.type,false);S.res[m.id]=r;if(S.hearts<=0)S.over=true;sfx.bad();save();afterResolve(true);
}
function afterResolve(lostHeart){
  UI.justDecided=true;renderHud();renderRail();renderList();renderRead();
  if(lostHeart){const hs=document.querySelectorAll('#hud .hrt');if(hs[S.hearts])hs[S.hearts].classList.add('lost')}
}
function mark(key){
  const m=cur();if(!m||S.res[m.id]||S.over)return;
  const a=S.marks[m.id]||(S.marks[m.id]=[]);const i=a.indexOf(key);
  if(i>=0)a.splice(i,1);else a.push(key);
  sfx.mark();renderRead();
}
function select(id){
  S.sel=id;S.read[id]=true;S.details=false;UI.mread=true;
  const w=$('#win');if(w)w.classList.add('mread');
  renderList();renderRead();
}
function next(){
  if(S.hearts<=0){UI.view='over';render();return}
  const un=S.order.filter(id=>!S.res[id]);
  if(!un.length){endShift();return}
  const i=S.order.indexOf(S.sel);
  const after=S.order.slice(i+1).concat(S.order.slice(0,i)).find(id=>!S.res[id]);
  select(after||un[0]);
}
function endShift(){
  const perfect=S.sh.wrong===0&&S.sh.clicks===0;
  const bonuses=[];
  if(perfect){bonuses.push(['Bezchybná směna',1000]);award('clean')}
  if(S.hearts>0)bonuses.push([`Zbývající důvěra (${S.hearts}×)`,S.hearts*200]);
  const tot=bonuses.reduce((s,b)=>s+b[1],0);S.money+=tot;S.bonuses=bonuses;S.bonusTot=tot;
  save();
  UI.view='shiftEnd';render();
}
function finishRun(){
  P.runs++;P.cleared++;P.best=Math.max(P.best,S.money);
  const acc=accOf();S.acc=acc;S.rank=rankOf(acc,S.stat.creds);
  award('grad');if(S.stat.fp===0)award('nopanic');if(S.stat.clicks===0&&S.stat.creds===0)award('nokick');if(S.rank.id==='master')award('master');
  save();UI.view='final';render();
}
function rankOf(acc,creds){
  if(acc>=95&&creds===0)return {id:'master',t:'Mistr obrany',d:'Phishing tě nezaskočí. Tvůj tým může spát klidně.'};
  if(acc>=80)return {id:'hunter',t:'Lovec phishingu',d:'Většinu pastí jsi odhalil a víš, kam se dívat.'};
  if(acc>=60)return {id:'guard',t:'Strážce schránky',d:'Dobrý základ. Zkus příští hru věnovat víc času technickým detailům.'};
  return {id:'intern',t:'Stážista',d:'Začátky bývají těžké. Projdi si příručku a zkus to znovu.'};
}

/* ---------- odkazy, přílohy a pasti ---------- */
function hostBold(u){const mm=u.match(/^(https?:\/\/)([^\/]+)(.*)$/);return mm?`${esc(mm[1])}<b>${esc(mm[2])}</b>${esc(mm[3])}`:esc(u)}
function openSheet(html){$('#modal').innerHTML=`<div class="back" id="backdrop"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;const b=$('#modal .b');if(b)b.focus()}
function closeModal(){$('#modal').innerHTML=''}
function linkSheet(d){
  const m=cur();if(!m||S.res[m.id]||S.over)return;
  const isAtt=d.kind==='att';
  const marked=(S.marks[m.id]||[]).includes(d.key);
  UI.pending=d;
  openSheet(`<h3>${isAtt?'Příloha':'Odkaz'}</h3>
    <p style="color:var(--ink-2);font-size:14px">${isAtt?'Soubor':'Zobrazený text'}: „${esc(d.text)}“</p>
    ${isAtt?`<code class="url">${esc(d.url)}</code>`:`<div class="sub-h" style="margin:0">Odkaz vede na</div><code class="url">${hostBold(d.url)}</code>`}
    <div class="srow"><button class="b b-ghost" data-act="s-open">${isAtt?'Otevřít přílohu':'Otevřít odkaz'}</button><button class="b ${marked?'b-ghost':'b-flag'}" data-act="s-mark">${marked?'Odznačit stopu':'Označit jako podezřelé'}</button><button class="b b-ghost" data-act="mclose">Zrušit</button></div>`);
  sfx.click();
}
function browser(url,inner){
  $('#modal').innerHTML=`<div class="back"><div class="bwin" role="dialog" aria-modal="true"><div class="btop"><span style="color:#44505d">${ic('lock',14)}</span><span class="burl">${esc(url)}</span><button data-act="trap-close" aria-label="Zavřít okno">${ic('x',18)}</button></div><div class="sim">Cvičná simulace – nic se nikam neodesílá.</div><div class="bpage">${inner}</div></div></div>`;
}
function openPending(){
  const d=UI.pending,m=cur();if(!d||!m)return;
  if(m.phish&&m.trap){
    const t=S.trap[m.id]||(S.trap[m.id]={});
    if(!t.clicked){t.clicked=true;S.money-=500;S.streak=0;S.sh.clicks++;S.stat.clicks++;renderHud()}
    const k=m.trap.kind,b=esc(m.trap.brand);
    let inner='';
    if(k==='login')inner=`<div class="fbrand"><i></i>${b}</div><h3>Přihlaste se</h3><label for="f1">E-mail</label><input id="f1" value="vy@novaterm.cz" readonly><label for="f2">Heslo</label><input id="f2" type="password" placeholder="Vaše heslo" autocomplete="off"><button class="fbtn" data-act="trap-submit">Přihlásit se</button><button class="linkbtn" data-act="trap-close" style="justify-self:start;color:#44505d">Zavřít okno</button>`;
    else if(k==='card')inner=`<div class="fbrand"><i></i>${b}</div><h3>Zaplaťte ${esc(m.trap.amount)}</h3><label for="c1">Číslo karty</label><input id="c1" placeholder="1234 5678 9012 3456" autocomplete="off"><div class="fgrid"><div><label for="c2">Platnost</label><input id="c2" placeholder="MM/RR" autocomplete="off"></div><div><label for="c3">CVV</label><input id="c3" placeholder="123" autocomplete="off"></div></div><button class="fbtn" data-act="trap-submit">Zaplatit ${esc(m.trap.amount)}</button><button class="linkbtn" data-act="trap-close" style="justify-self:start;color:#44505d">Zavřít okno</button>`;
    else inner=`<div class="fbrand"><i></i>${b}</div><div class="docbar"><span>Zabezpečené zobrazení: soubor pochází z internetu.</span><button data-act="trap-submit">Povolit úpravy a makra</button></div><div class="doc"><i style="width:60%"></i><i></i><i style="width:88%"></i><i style="width:74%"></i><i></i></div><button class="linkbtn" data-act="trap-close" style="justify-self:start;color:#44505d">Zavřít soubor</button>`;
    browser(d.kind==='att'?'Soubor: '+d.url:d.url,inner);
  }else{
    const s=m.safe||{title:d.text,text:'Stránka se načetla bez problémů.'};
    browser(d.kind==='att'?'Soubor: '+d.text:d.url,`<div class="safe-ok">${ic('check',22)}Stránka je v pořádku</div><h3>${esc(s.title)}</h3><p style="color:#44505d">${esc(s.text)}</p><button class="fbtn" data-act="trap-close">Zavřít okno</button>`);
  }
}
function closeTrap(){
  const m=cur();closeModal();
  if(m&&m.phish&&S.trap[m.id]&&S.trap[m.id].clicked&&!S.res[m.id]){
    toast('Zavřel jsi stránku včas. Otevření podezřelého odkazu ale stálo 500 Kč.');sfx.bad();
  }
  renderRead();
}
function submitTrap(){const m=cur();closeModal();if(m&&!S.res[m.id])compromise(m)}

/* ---------- konec směny, prohra, výsledky ---------- */
function outcomeRow(id){
  const m=BYID[id],r=S.res[id];const o=fbOutcome(m,r);
  const col=o.c==='good'?'good':o.c==='bad'?'bad':o.c==='warn'?'warn':'neu';
  return `<li><span class="st ${col}" style="align-self:start;white-space:nowrap">${o.stamp}</span><div><div class="sj">${esc(m.subj)}</div><p>${esc(m.why)}</p></div></li>`;
}
function renderShiftEnd(){
  const good=S.order.filter(id=>S.res[id]&&S.res[id].ok).length;
  const nb=S.newBadges.map(id=>BADGES.find(b=>b.id===id).n);
  app.innerHTML=`${topbar()}<div class="card">
    <div class="eyebrow">Směna ${S.shift+1} z ${SHIFTS.length} hotová</div>
    <h2 style="font-size:clamp(28px,5vw,46px);font-weight:800;margin-top:6px">${S.sh.wrong===0&&S.sh.clicks===0?'Čistá práce':'Směna za tebou'}</h2>
    <div class="sum-grid"><div class="kpi"><b>${good}/${S.order.length}</b><span>správných rozhodnutí</span></div><div class="kpi"><b>${kc(S.money)}</b><span>kasa firmy</span></div><div class="kpi"><b>${S.hearts}/3</b><span>zbývající důvěra</span></div><div class="kpi"><b>${accOf()} %</b><span>úspěšnost celkem</span></div></div>
    ${S.bonuses&&S.bonuses.length?`<div class="ledger" style="max-width:380px;margin-bottom:18px">${S.bonuses.map(b=>`<div><span>${esc(b[0])}</span><b class="pos">${sg(b[1])}</b></div>`).join('')}</div>`:''}
    ${nb.length?`<p style="margin-bottom:12px"><b>Nové odznaky:</b> ${nb.map(esc).join(', ')}</p>`:''}
    <div class="sub-h">Co ses naučil</div><ul class="rowlist">${S.order.map(outcomeRow).join('')}</ul>
    <div class="actions"><button class="b b-flag b-big" data-act="nextshift">${S.shift>=SHIFTS.length-1?'Převzít certifikát':'Další směna'}</button></div></div>`;
  S.newBadges=[];
}
function renderOver(){
  const bad=S.order.filter(id=>S.res[id]&&!S.res[id].ok&&S.res[id].act!=='it');
  app.innerHTML=`${topbar()}<div class="card">
    <div class="eyebrow">Směna ${S.shift+1} přerušena</div>
    <h2 style="font-size:clamp(28px,5vw,46px);font-weight:800;margin:6px 0 10px">Vedení ti dnes důvěru nedalo</h2>
    <p class="lead" style="margin-top:0">Došly ti životy důvěry. V reálném světě by to znamenalo napadenou firmu. Tady si můžeš směnu zkusit znovu.</p>
    <div class="sub-h">Kde to selhalo</div><ul class="rowlist">${bad.map(outcomeRow).join('')}</ul>
    <div class="actions"><button class="b b-flag b-big" data-act="retry">Opakovat směnu</button><button class="b b-ghost b-big" data-act="title">Do menu</button></div></div>`;
}
function resultText(){return `Lovec phishingu: ${S.rank.t}, kasa ${kc(S.money)}, úspěšnost ${S.acc} %. Zvládneš to líp?`}
function renderFinal(){
  const nb=S.newBadges.map(id=>BADGES.find(b=>b.id===id).n);
  const name=P.name||'Neznámý lovec';
  const d=new Date().toLocaleDateString('cs-CZ');
  app.innerHTML=`${topbar()}<div class="card">
    <div class="eyebrow">Všechny směny dokončeny</div>
    <div class="cert"><div class="eyebrow">Certifikát</div><div class="nm" style="margin-top:8px">${esc(name)}</div><p style="color:var(--ink-2)">získává hodnost</p><h2>${esc(S.rank.t)}</h2><p style="max-width:44ch;margin:0 auto 10px">${esc(S.rank.d)}</p><p class="eyebrow">${d} · Novaterm s.r.o.</p></div>
    <div class="sum-grid"><div class="kpi"><b>${kc(S.money)}</b><span>kasa firmy</span></div><div class="kpi"><b>${S.acc} %</b><span>úspěšnost</span></div><div class="kpi"><b>${S.stat.fp}</b><span>falešných poplachů</span></div><div class="kpi"><b>${S.stat.clicks+S.stat.creds}</b><span>otevřených pastí</span></div></div>
    ${nb.length?`<p style="margin-bottom:12px"><b>Nové odznaky:</b> ${nb.map(esc).join(', ')}</p>`:''}
    <div class="sub-h">Tvůj výsledek ke sdílení</div>
    <div class="copybox"><input id="cp" readonly value="${esc(resultText())}" aria-label="Text výsledku"><button class="b b-ghost" data-act="copy">Kopírovat</button></div>
    <div class="actions"><button class="b b-flag b-big" data-act="start">Hrát znovu</button><button class="b b-ghost b-big" data-act="archive">Příručka a statistiky</button></div></div>`;
  S.newBadges=[];
}
function renderArchive(){
  const tabs=[['lib','Příručka'],['badges','Odznaky'],['stats','Statistiky']];
  let body='';
  if(UI.tab==='lib'){
    body=`<div class="lib">${Object.entries(TYPES).map(([k,t])=>P.unlocked[k]?
      `<article class="lcard"><div style="display:flex;gap:10px;align-items:center"><span class="gl">${t.g}</span><h3>${esc(t.n)}</h3></div><p style="font-size:14px">${esc(t.s)}</p><ul>${t.signs.map(s=>`<li>${esc(s)}</li>`).join('')}</ul><div class="do"><b>Co dělat:</b> ${esc(t.do)}</div></article>`:
      `<article class="lcard lock"><div style="display:flex;gap:10px;align-items:center"><span class="gl">?</span><h3>Zamčená kapitola</h3></div><p style="font-size:14px">Odemkne se, když se v poště poprvé setkáš s tímto typem zprávy.</p></article>`).join('')}</div>`;
  }else if(UI.tab==='badges'){
    body=`<div class="bgrid">${BADGES.map(b=>`<div class="badge ${P.badges[b.id]?'':'off'}"><span class="gl">${P.badges[b.id]?'★':'–'}</span><div><b>${esc(b.n)}</b><span>${esc(b.d)}</span></div></div>`).join('')}</div>`;
  }else{
    const rows=Object.entries(P.ts).filter(([,t])=>t.n);
    body=`<div class="sum-grid"><div class="kpi"><b>${P.runs}</b><span>odehraných her</span></div><div class="kpi"><b>${kc(P.best)}</b><span>nejlepší kasa</span></div><div class="kpi"><b>${Object.keys(P.badges).length}/${BADGES.length}</b><span>odznaků</span></div></div>
    <div class="sub-h">Úspěšnost podle typu zprávy</div>${rows.length?rows.map(([k,t])=>{const p=Math.round(100*t.ok/t.n);return `<div class="trow"><span>${esc(TYPES[k]?TYPES[k].n:k)}</span><div class="bar"><i style="width:${p}%"></i></div><b style="font-variant-numeric:tabular-nums;text-align:right">${p} %</b></div>`}).join(''):'<p style="color:var(--ink-2)">Zatím žádná data. Odehraj první směnu.</p>'}
    <div class="actions"><button class="b b-ghost" data-act="reset">${UI.confirmReset?'Opravdu smazat? Klikni znovu':'Smazat uložený postup'}</button></div>`;
  }
  app.innerHTML=`${topbar(`<button class="b b-ghost" data-act="title">${ic('back',16)}Zpět</button>`)}<div class="card"><h2 style="font-size:clamp(28px,5vw,44px);font-weight:800;margin-bottom:10px">Archiv lovce</h2>
    <div class="tabs" role="tablist">${tabs.map(t=>`<button class="tab ${UI.tab===t[0]?'on':''}" role="tab" aria-selected="${UI.tab===t[0]}" data-act="tab" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div>${body}</div>`;
}

/* ---------- události ---------- */
const H={
  start(){const n=$('#nm');if(n){P.name=n.value.trim();save()}newRun();startShift(0);UI.view='brief';render()},
  play(){UI.view='game';UI.mread=false;render()},
  nextshift(){if(S.shift>=SHIFTS.length-1){finishRun();return}startShift(S.shift+1);UI.view='brief';render()},
  retry(){S.money=S.snap.money;S.streak=S.snap.streak;S.stat=Object.assign({},S.snap.stat);startShift(S.shift);UI.view='game';UI.mread=false;render()},
  title(){UI.view='title';UI.confirmReset=false;render()},
  quit(){openSheet(`<h3>Ukončit hru?</h3><p style="color:var(--ink-2)">Rozehraný postup se neukládá. Odznaky a příručka zůstanou.</p><div class="srow"><button class="b b-flag" data-act="title-go">Ukončit</button><button class="b b-ghost" data-act="mclose">Pokračovat ve hře</button></div>`)},
  'title-go'(){closeModal();UI.view='title';render()},
  archive(){UI.view='archive';render()},
  tab(t){UI.tab=t.dataset.tab;UI.confirmReset=false;renderArchive()},
  reset(){if(!UI.confirmReset){UI.confirmReset=true;renderArchive();return}P={name:P.name,best:0,runs:0,cleared:0,unlocked:{},ts:{},badges:{},muted:P.muted,fullClues:0};save();UI.confirmReset=false;renderArchive()},
  mute(){P.muted=!P.muted;save();if(UI.view==='game')renderHud();else render()},
  sel(t){select(+t.dataset.id)},
  back(){UI.mread=false;const w=$('#win');if(w)w.classList.remove('mread')},
  details(t){if(t.classList.contains('sname')||t.classList.contains('linkbtn')){S.details=!S.details;renderRead()}},
  mark(t){mark(t.dataset.c)},
  link(t){linkSheet({kind:'link',url:t.dataset.url,text:t.dataset.t,key:t.dataset.c})},
  att(t){const m=cur(),a=m.att[+t.dataset.i];linkSheet({kind:'att',url:a.name+' ('+a.size+')',text:a.name,key:t.dataset.c})},
  's-open'(){const d=UI.pending;closeModal();if(d)UI.pending=d;openPending()},
  's-mark'(){const d=UI.pending;closeModal();if(d)mark(d.key)},
  mclose(){closeModal()},
  'trap-close'(){closeTrap()},
  'trap-submit'(){submitTrap()},
  report(){decide('report')},ok(){decide('ok')},it(){decide('it')},
  next(){next()},
  copy(){const i=$('#cp');const txt=i.value;
    const fb=()=>{i.select();toast('Text je označený, zkopíruj ho ručně.')};
    try{navigator.clipboard.writeText(txt).then(()=>toast('Zkopírováno'),fb)}catch(e){fb()}}
};
document.addEventListener('click',e=>{
  if(e.target.id==='backdrop'){closeModal();return}
  const t=e.target.closest('[data-act]');if(!t)return;
  const f=H[t.dataset.act];if(!f)return;
  e.preventDefault();
  if(t.disabled)return;
  f(t,e);
});
document.addEventListener('input',e=>{if(e.target.id==='nm'){P.name=e.target.value.trim();save()}});
function setStatus(txt,on){const s=$('#status');if(!s)return;s.textContent=txt||'Připraveno';s.classList.toggle('on',!!on)}
document.addEventListener('mouseover',e=>{
  const u=e.target.closest('[data-url]');
  if(u){setStatus('→ '+u.dataset.url,true);return}
  const a=e.target.closest('.sname');
  if(a){setStatus('Odesílatel: '+a.dataset.addr,true)}
});
document.addEventListener('mouseout',e=>{if(e.target.closest('[data-url],.sname'))setStatus('')});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#modal').innerHTML){closeModal();return}
  if(UI.view!=='game'||$('#modal').innerHTML||e.target.closest('input'))return;
  const k=e.key.toLowerCase();
  if(k==='r')decide('report');else if(k==='o')decide('ok');else if(k==='i')decide('it');
});
render();
})();
</script>
